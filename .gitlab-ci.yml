image: docker:26

services:
  - name: docker:26-dind
    alias: docker

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2

  IMAGE_NAME: mini-projet-gitlab

  SERVER_USERNAME: ubuntu
  REVIEW_SERVER_IP: 18.234.82.173
  STAGING_SERVER_IP: 54.174.177.10
  PROD_SERVER_IP: 98.81.91.170

stages:
  - build
  - test
  - publish
  - deploy_review
  - deploy_staging
  - deploy_prod

# ========================
# BUILD
# ========================
build:
  stage: build
  script:
    - docker info
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHA .
    - docker save -o image.tar $IMAGE_NAME:$CI_COMMIT_SHA
  artifacts:
    paths:
      - image.tar

# ========================
# TEST
# ========================
test:
  stage: test
  script:
    - docker load -i image.tar
    - docker rm -f test-app || true
    - docker run -d -p 80:80 --name test-app $IMAGE_NAME:$CI_COMMIT_SHA
    - sleep 15
    - apk add --no-cache curl
    - curl -I http://docker || exit 1

# ========================
# PUBLISH
# ========================
publish:
  stage: publish
  script:
    - docker load -i image.tar
    - docker tag $IMAGE_NAME:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

# ========================
# REVIEW
# ========================
deploy_review:
  image: alpine:latest
  stage: deploy_review
  before_script:
    - apk add --no-cache openssh-client
    - echo "$ID_RSA" > id_rsa
    - chmod 600 id_rsa
  script:
    - ssh -i id_rsa -o StrictHostKeyChecking=no $SERVER_USERNAME@$REVIEW_SERVER_IP \
      "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh -i id_rsa -o StrictHostKeyChecking=no $SERVER_USERNAME@$REVIEW_SERVER_IP \
      "docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - ssh -i id_rsa -o StrictHostKeyChecking=no $SERVER_USERNAME@$REVIEW_SERVER_IP \
      "docker rm -f review-app || true"
    - ssh -i id_rsa -o StrictHostKeyChecking=no $SERVER_USERNAME@$REVIEW_SERVER_IP \
      "docker run -d -p 80:80 --restart always --name review-app $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  environment:
    name: review
    url: http://$REVIEW_SERVER_IP
  rules:
    - if: '$CI_COMMIT_BRANCH != "master" && $CI_COMMIT_BRANCH != "develop"'

# ========================
# STAGING
# ========================
deploy_staging:
  image: alpine:latest
  stage: deploy_staging
  before_script:
    - apk add --no-cache openssh-client
    - echo "$ID_RSA" > id_rsa
    - chmod 600 id_rsa
  script:
    - ssh -i id_rsa -o StrictHostKeyChecking=no $SERVER_USERNAME@$STAGING_SERVER_IP \
      "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh -i id_rsa -o StrictHostKeyChecking=no $SERVER_USERNAME@$STAGING_SERVER_IP \
      "docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - ssh -i id_rsa -o StrictHostKeyChecking=no $SERVER_USERNAME@$STAGING_SERVER_IP \
      "docker rm -f staging-app || true"
    - ssh -i id_rsa -o StrictHostKeyChecking=no $SERVER_USERNAME@$STAGING_SERVER_IP \
      "docker run -d -p 80:80 --restart always --name staging-app $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  environment:
    name: staging
    url: http://$STAGING_SERVER_IP
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ========================
# PROD
# ========================
deploy_prod:
  image: alpine:latest
  stage: deploy_prod
  before_script:
    - apk add --no-cache openssh-client
    - echo "$ID_RSA" > id_rsa
    - chmod 600 id_rsa
  script:
    - ssh -i id_rsa -o StrictHostKeyChecking=no $SERVER_USERNAME@$PROD_SERVER_IP \
      "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh -i id_rsa -o StrictHostKeyChecking=no $SERVER_USERNAME@$PROD_SERVER_IP \
      "docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - ssh -i id_rsa -o StrictHostKeyChecking=no $SERVER_USERNAME@$PROD_SERVER_IP \
      "docker rm -f prod-app || true"
    - ssh -i id_rsa -o StrictHostKeyChecking=no $SERVER_USERNAME@$PROD_SERVER_IP \
      "docker run -d -p 80:80 --restart always --name prod-app $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  environment:
    name: production
    url: http://$PROD_SERVER_IP
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'